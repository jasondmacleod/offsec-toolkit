# symptom_map.yaml — stuckr.sh symptom → action map
#
# Schema (per stuckr design spec §5):
#   - symptom:        sentinel key (matches what enum scripts emit to sentinels.log)
#     context:        one-line plain-English surface text (operator sees this)
#     category:       lifecycle bucket — foothold | privesc | lateral | recon-extension
#     actions:        2-4 ordered by author preference
#       - slug:           must resolve in exploitdb corpus (gaps logged silently to symptom_map_gaps.md)
#         match_strength: strong | moderate | weak
#         requires:       precondition list (creds, foothold, domain-context, adjacent-host,
#                         web-app, windows-host, linux-host, ad-context, smb-port, db-port)
#
# Authoring conventions:
#   - Two or more actions per symptom; cap at four
#   - First action is "if you have the easiest follow-on path, take this"
#   - Substituted slugs (gap-fill) are invisible at output layer — see
#     ~/offsec-toolkit/exploitdb/data/seed/symptom_map_gaps.md for the substitution log
#
# Last updated: 2026-05-20
#==============================================================================

